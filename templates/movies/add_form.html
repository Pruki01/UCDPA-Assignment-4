{% extends 'base.html' %}
{% block content %}

<form action="" method="post" enctype="multipart/form-data">

    {{ form.hidden_tag() }}
    <div>
        {{ form.title.label }}
        {{ form.title(size=50) }}
    </div>
    <div>
        {{ form.duration.label }}
        {{ form.duration }}
    </div>
    <div>
        {{ form.file.label }}
        {{ form.file() }}
    </div>
    <div>
        {{ form.submit() }}
    </div>

</form>
{% endblock %}
