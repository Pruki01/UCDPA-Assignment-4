{% extends 'base.html' %}

{% block content %}

    <h1>Register</h1>
    <form action="" method="post">
        <div>
            {{ form.email.label }}
            {{ form.email(size=50)}}
        </div>
        <div>
            {{ form.password.label }}
            {{ form.password(size=50) }}
        </div>
        <div>
            {{ form.confirm_p.label }}
            {{ form.confirm_p(size=50) }}
        </div>
        <div>
            {{ form.submit() }}
        </div>
    </form>

{% endblock %}
