{% extends 'base.html' %}

{% block content %}

    <h1>Sign In</h1>
    <form action="" method="post" novalidate>
        {{ form.hidden_tag() }}
        <div>
            {{ form.email.label }}
            {{ form.email(size=50)}}
        </div>
        <div>
            {{ form.password.label }}
            {{ form.password(size=50)}}
        </div>
        <div>
            {{ form.remember_me() }} {{ form.remember_me.label }}
        </div>
        <div>
            {{ form.submit() }}
        </div>
    </form>

{% endblock %}
